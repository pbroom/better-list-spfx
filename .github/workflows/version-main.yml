name: Version main

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    name: Advance the main version
    runs-on: ubuntu-latest
    env:
      TRIGGER_BEFORE: ${{ github.event.before }}
      TRIGGER_SHA: ${{ github.sha }}
    steps:
      - name: Check out main with version history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Respect an intentional version change in the merged work
        id: trigger-version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TRIGGER_BEFORE" =~ ^0+$ ]] ||
            ! git cat-file -e "${TRIGGER_BEFORE}:package.json" 2>/dev/null; then
            echo "Cannot read package.json from the previous main tip $TRIGGER_BEFORE." >&2
            echo "Refusing to guess whether this push already advanced the version." >&2
            exit 1
          fi
          before_version="$(
            git show "${TRIGGER_BEFORE}:package.json" |
              node scripts/sync-spfx-version.mjs --print-package-version
          )"
          trigger_version="$(
            git show "${TRIGGER_SHA}:package.json" |
              node scripts/sync-spfx-version.mjs --print-package-version
          )"
          {
            echo "before=$before_version"
            echo "after=$trigger_version"
          } >> "$GITHUB_OUTPUT"
          if [[ "$trigger_version" != "$before_version" ]]; then
            git switch --detach "$TRIGGER_SHA"
            node scripts/sync-spfx-version.mjs --check
            node scripts/sync-spfx-version.mjs --assert-newer-than "$before_version"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch-increment main exactly once for this merge
        if: steps.trigger-version.outputs.changed == 'false'
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=false
          for attempt in {1..10}; do
            git fetch --no-tags origin main
            if git log origin/main --format=%B |
              grep -Fx "Version-Bump-For: $TRIGGER_SHA" >/dev/null; then
              echo "The version bump for $TRIGGER_SHA is already on main."
              exit 0
            fi

            git switch --detach origin/main
            env -u PUSH_TOKEN npm run version:bump
            env -u PUSH_TOKEN npm run version:check
            # Release tooling tests intentionally use only Node.js built-ins so
            # this version-only job does not need a dependency installation.
            env -u PUSH_TOKEN npm run test:release
            version="$(env -u PUSH_TOKEN node -p "require('./package.json').version")"
            git add package.json package-lock.json config/package-solution.json
            git commit \
              -m "chore(version): bump main to $version" \
              -m "Version-Bump-For: $TRIGGER_SHA"
            auth_header="$(
              printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n'
            )"
            if git \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
              push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "main advanced during attempt $attempt; retrying from the new tip." >&2
          done
          if [[ "$pushed" != "true" ]]; then
            echo "Could not advance main after 10 optimistic retries." >&2
            exit 1
          fi

          {
            echo "### Main version advanced"
            echo
            echo "- Trigger: \`$TRIGGER_SHA\`"
            echo "- Version: \`$version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record intentional version advancement
        if: steps.trigger-version.outputs.changed == 'true'
        run: |
          {
            echo "### Main version already advanced"
            echo
            echo "The merged work intentionally moved \`${{ steps.trigger-version.outputs.before }}\` to \`${{ steps.trigger-version.outputs.after }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
