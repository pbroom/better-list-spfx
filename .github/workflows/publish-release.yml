name: Publish reviewed release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reviewed draft tag in vX.Y.Z form
        required: true
        type: string

permissions: {}

concurrency:
  group: release-mutation
  queue: max

jobs:
  inspect:
    name: Inspect the reviewed draft
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are visible only to a token with push access.
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      sha: ${{ steps.release.outputs.sha }}
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Require the main workflow definition
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publishing must be dispatched from the main workflow definition." >&2
            exit 1
          fi

      - name: Check out the release orchestration and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Validate the reviewed draft and snapshot
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi

          snapshot_branch="release/$RELEASE_TAG"
          git fetch --no-tags origin main "$snapshot_branch"
          snapshot_sha="$(git rev-parse "origin/$snapshot_branch")"
          if ! git merge-base --is-ancestor "$snapshot_sha" origin/main; then
            echo "$snapshot_sha is no longer reachable from origin/main." >&2
            exit 1
          fi

          release_json="$(
            node scripts/release-lifecycle.mjs inspect --sha "$snapshot_sha"
          )"

          {
            echo "sha=$snapshot_sha"
            echo "release_id=$(jq -r '.id' <<<"$release_json")"
          } >> "$GITHUB_OUTPUT"

  rebuild:
    name: Rebuild the reviewed snapshot
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      version: ${{ steps.release.outputs.version }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SNAPSHOT_SHA: ${{ needs.inspect.outputs.sha }}
    steps:
      - name: Check out the immutable snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.inspect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate the snapshot version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "$RELEASE_TAG does not match snapshot version $version." >&2
            exit 1
          fi
          npm run version:check
          parent_version="$(
            git show "${SNAPSHOT_SHA}^:package.json" |
              node scripts/sync-spfx-version.mjs --print-package-version
          )"
          node scripts/sync-spfx-version.mjs --assert-newer-than "$parent_version"

          {
            echo "version=$version"
            echo "source_date_epoch=$(git show -s --format=%ct "$SNAPSHOT_SHA")"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies cleanly
        run: npm ci

      - name: Rerun release tooling tests
        run: npm run test:release

      - name: Rebuild self-contained package and CDN template
        run: npm run release:build

      - name: Reconstruct and verify release assets
        run: |
          npm run release:prepare -- \
            --tag "$RELEASE_TAG" \
            --commit "$SNAPSHOT_SHA" \
            --source-date-epoch "${{ steps.release.outputs.source_date_epoch }}" \
            --output-dir release-output
          npm run release:verify -- \
            --tag "$RELEASE_TAG" \
            --commit "$SNAPSHOT_SHA" \
            --output-dir release-output

      - name: Preserve the rebuilt assets for the gated publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-${{ inputs.release_tag }}
          path: release-output/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the revalidated draft
    needs: [inspect, rebuild]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_ID: ${{ needs.inspect.outputs.release_id }}
      SNAPSHOT_SHA: ${{ needs.inspect.outputs.sha }}
    steps:
      - name: Check out the release orchestration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Download the clean rebuild
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publish-${{ inputs.release_tag }}
          path: release-output

      - name: Revalidate, pin the tag, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(node scripts/release-lifecycle.mjs publish)"

          {
            echo "### Release published"
            echo
            echo "- Version: \`${{ needs.rebuild.outputs.version }}\`"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Snapshot: \`$SNAPSHOT_SHA\`"
            echo "- Release: $(jq -r '.url' <<<"$release_json")"
          } >> "$GITHUB_STEP_SUMMARY"
